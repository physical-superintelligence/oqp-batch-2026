# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Three-copy nondistillability of the qutrit Werner state"
  description: >-
    Lean 4 formalization of the qutrit (d = 3), three-copy part of Theorem 2.1 and Corollary 2.2 of the
    manuscript "Three-copy nondistillability of qutrit and ququart Werner states": the endpoint
    inequality q(C) >= 0 for every complex 27 x 27 matrix C of rank at most two (Theorem 2.1 at
    alpha = 1/2), proved from an exact symmetry-reduced certificate whose data the Lean kernel checks;
    the sharp minimum (1 - 2 alpha)(1 - alpha)^2 of q_alpha over normalized matrices of rank at most two
    for 0 <= alpha <= 1/2 (also for local dimensions 2 <= d_i <= 3) and the shape of the minimizers for
    0 < alpha < 1/2; and, for the qutrit Werner
    state, three-copy distillability by local filters exactly when alpha > 1/2, NPT with three-copy
    nondistillability for 1/3 < alpha <= 1/2, and overlap at most 1/2 with the maximally entangled state
    for trace-preserving separable operations from three copies to two qubits when 0 <= alpha <= 1/2.
    Also formalized: the identities of Sections 2 and 3, the PPT region, the zero families of Theorem 5.1
    and the analytic inputs of Appendix C, the full-rank family of Section 6.2, and the soundness of an
    exact certificate (Section 4.1).
  authors:
    - "David Turturean"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Turturean"

classification:
  arxiv: ["quant-ph", "math-ph"]
  msc2020: ["81P40", "81P45", "15A69", "15B57", "68V20"]

sources:
  - title: "Three-copy nondistillability of qutrit and ququart Werner states"
    authors:
      - "Physical Superintelligence (PSI)"
    type: "paper"
    location: "Manuscript of 21 October 2026; Theorem 2.1 and Corollary 2.2 at d = 3."
    relationship: "formalizes"
    note: >-
      The manuscript proves Theorem 2.1 and Corollary 2.2 for d = 3 and d = 4; their qutrit case
      d = 3 is formalized, with the endpoint
      inequality proved from an exact certificate of the form of Section 4.1 (the manuscript's rational
      trial tuple with an exact rational correction that solves the coefficient equations exactly, in
      place of the correction of eq. (20)), and the further results of Sections 1-6 and Appendices A-C
      listed in docs/FIDELITY.md; docs/PAPER_TO_LEAN.md maps every numbered statement and equation.
    license: "unknown"
    author_endorsement: "other"

related_formalizations: []

status:
  scope: >-
    The 48 theorems of Challenge.lean: the qutrit endpoint inequality (Theorem 2.1 at alpha = 1/2) and
    its consequences in Theorem 2.1 and Corollary 2.2 for the qutrit Werner state, with distillability in
    the local-filter sense and the overlap claim for trace-preserving separable operations, as
    Corollary 2.2 states it; the further
    results of the manuscript listed in docs/FIDELITY.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

