alignment:
  namespace: "VacuumBellSeparation"
  statements:
    - source: "Open Quantum Problem 12, bounded regions along a fixed spacelike direction (CHSH form of Corollary 1.2)"
      lean: "VacuumBellSeparation.OQP12.no_chsh_violation_far_apart"
      module: "Solution"
      status: "proved"
      note: "Headline. Stated in Challenge.lean; every m > 0, bounded regions, fixed spacelike direction, every vacuum Weyl system and all self-adjoint contractions."
    - source: "Theorem 1.1"
      lean: "VacuumBellSeparation.OQP12.theorem_1_1"
      module: "Solution"
      status: "proved"
      note: "One constant C_* > 2 for all m, R > 0; double cones of radius R with centres at spatial distance L >= C_* R along e1; Bell correlation written out as the supremum of the CHSH values."
    - source: "Corollary 1.2"
      lean: "VacuumBellSeparation.OQP12.corollary_1_2"
      module: "Solution"
      status: "proved"
      note: "Fixed bounded regions and fixed spacelike direction; Summers-Werner normalization beta = 1, written out as the supremum of the CHSH values."
    - source: "Section 2.1 (the model is not empty)"
      lean: "VacuumBellSeparation.OQP12.freeFieldVacuum_exists"
      module: "Solution"
      status: "proved"
      note: "A vacuum Weyl system exists for every mass m > 0."
    - source: "Open Quantum Problem 12, bounded regions moved by spatial translations, uniformly over directions (consequence of Theorem 1.1 added for this release)"
      lean: "VacuumBellSeparation.OQP12.no_chsh_violation_far_apart_uniform"
      module: "Solution"
      status: "proved"
      note: "One distance D for all spatial translations of the second region with length at least D; from Theorem 1.1, a spatial reflection and isotony."
    - source: "Sanity check of the definitions"
      lean: "VacuumBellSeparation.OQP12.localAlgebra_open_nonabelian"
      module: "Solution"
      status: "proved"
      note: "The local algebra of every nonempty open region contains two noncommuting operators."
