        directed by PSI. The release snapshot (module-system port, Challenge.lean, the CHSH bridge
        theorems, the axiom check, documentation) was prepared by an agent on Anthropic's Claude Opus 5.5 (Claude Code).
      cost:
        wall_time: "formalization 2026-10-08 to 2026-10-14; release packaging 2026-10-14 and 2026-10-21"
        spend_usd: "not tracked"
        hardware: "API-only agents; remote Linux build machines"
      prompting_notes: "Agents worked from the manuscript, one task file and persistent checkpoints."
    - method: "agent"
      models: ["OpenAI's GPT-6-Astra"]
      framework: "Codex"
      tool_setup: "Codex agents continued the formalization from 2026-10-09, with at most two managed subagents."
      cost:
        wall_time: "2026-10-09 to 2026-10-13"
        spend_usd: "subscription-based"
        hardware: "API-only agents; remote Linux build machines"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Provenance and use of AI. This result was released by Physical Superintelligence (PSI). The
    mathematics was developed by PSI researchers working with AI models (OpenAI's GPT-6-Astra
    and GPT-5.6 Pro and Anthropic's Claude Fable 5.1) in automated research workflows at PSI.
    The Lean formalization was written by AI agents (Anthropic's Claude Opus 5.5 in Claude Code, and OpenAI's GPT-6-Astra in Codex) under
    PSI's direction. David Turturean is responsible for the correctness of the paper. The
    paper's AI disclosure has the details; this file records which agent did which part.
    Comparator checks that the theorems proved in Solution.lean are exactly the statements in
    Challenge.lean, using only the three standard axioms, and the proofs are replayed by Lean's
    kernel and by independent kernels.

