# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Bell inequalities for long range vacuum correlations (Open Quantum Problem 12)"
  description: >-
    Lean 4 formalization of the main theorem of the full manuscript of 21 October 2026,
    "The vacuum Bell correlation of the massive free scalar field attains the classical bound for bounded regions beyond a finite separation": for the
    vacuum of the real free scalar field of any mass m > 0 in 3+1-dimensional Minkowski space, the
    Summers-Werner Bell correlation of the local von Neumann algebras of two double cones of radius
    R centred at the origin and at (0, L e1) equals its classical value 1 once L is at least a
    constant multiple of R, with one constant for all masses and radii (Theorem 1.1), and the same
    holds for any two bounded regions when the second is moved far enough along a fixed spacelike
    direction (Corollary 1.2). Stated as the CHSH inequality for all local observables, along a
    fixed spacelike direction and for spatial translations with one threshold for all directions,
    this answers Problem 12 of the IQOQI Vienna Open Quantum Problems, "Bell inequalities for long
    range vacuum correlations", in the negative for bounded regions moved apart in these ways. The
    existence of the vacuum representation and the noncommutativity of the local algebras are also
    formalized.
  authors:
    - "David Turturean"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Turturean"

