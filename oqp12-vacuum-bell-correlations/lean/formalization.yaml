related_formalizations: []

status:
  scope: >-
    Theorem 1.1 and Corollary 1.2 of the full manuscript of 21 October 2026 for every mass m > 0, with the vacuum representation
    given by its defining properties (Weyl relations of the one-particle inner product, Gaussian
    vacuum expectations, cyclic vacuum) and quantified over all such representations; the CHSH
    inequality for all self-adjoint contractions localized in two bounded regions beyond a
    separation threshold, along a fixed spacelike direction and uniformly over spatial directions;
    existence of the vacuum representation for every mass; noncommutativity of the local algebra of
    every nonempty open region.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

