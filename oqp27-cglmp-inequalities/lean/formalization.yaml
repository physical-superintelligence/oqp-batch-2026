alignment:
  namespace: "OQP27"
  statements:
    - source: "Problem 27.B, first claim; Theorem A.1 (bound and equality case)"
      lean: "OQP27.partB_maximizers_are_fourier_phase"
      module: "Solution"
      status: "proved"
      note: "Projective measurements, any dimension n; equality iff n = dk and unitary conjugacy to the Fourier-phase measurements tensored with the identity."
    - source: "Problem 27.B, second claim (refuted); equation (A.6)"
      lean: "OQP27.partB_noise_resistance_not_optimal"
      module: "Solution"
      status: "proved"
      note: "critVisibility(T_m) < critVisibility(Q_{2^m}) for m >= 955."
    - source: "Problem 27.B, third claim (refuted); equation (F.16)"
      lean: "OQP27.partB_kl_discrimination_not_optimal"
      module: "Solution"
      status: "proved"
      note: "sup over input laws of statStrength(Q_{2^m}) < statStrength(uniform, T_m) for m >= 41."
    - source: "The CGLMP inequality (local bound of (B.1))"
      lean: "OQP27.cglmp_local_bound"
      module: "Solution"
      status: "proved"
      note: "I_d <= 2 on the local polytope, with equality for some local behaviour."
    - source: "Theorem A.1 (attainment) and (A.5)"
      lean: "OQP27.fourier_attains_cglmp_value"
      module: "Solution"
      status: "proved"
      note: "Q_d attains I_d^F > 2; noise threshold 2/I_d^F."
    - source: "(B.2)"
      lean: "OQP27.fourier_projectors_pvm"
      module: "Solution"
      status: "proved"
      note: "The Fourier-phase projectors form projective measurements."
    - source: "Appendix B (tracial form)"
      lean: "OQP27.tracial_table_physical"
      module: "Solution"
      status: "proved"
      note: "Link between tracialTable and the behaviour of |Phi_n><Phi_n| with Alice's transposed measurements."
    - source: "Appendix F.2 (tensor-CHSH measurements)"
      lean: "OQP27.tensor_chsh_rank_one_pvm"
      module: "Solution"
      status: "proved"
      note: "T_m's settings are complete rank-one projective measurements on C^(2^m)."
    - source: "(A.5) (CGLMP-witness threshold)"
      lean: "OQP27.cglmp_witness_tolerance"
      module: "Solution"
      status: "proved"
      note: "The Fourier family minimizes the CGLMP-witness noise threshold, with equality exactly in the case of Theorem A.1."
    - source: "Equation (A.6)"
      lean: "OQP27.noise_separation_955"
      module: "Solution"
      status: "proved"
      note: "critVisibility(T_m) < 3049/5000 < critVisibility(Q_{2^m}) for m >= 955."
    - source: "Equation (F.16)"
      lean: "OQP27.statistical_separation"
      module: "Solution"
      status: "proved"
      note: "Explicit constants (9/14) log2(4/3) and (16/25) log2(4/3)."
    - source: "Problem 27.A; Proposition G.1 (facet)"
      lean: "OQP27.bgp_facet"
      module: "Solution"
      status: "proved"
      note: "The Bancal-Gisin-Pironio facet of C_4."
    - source: "Problem 27.A; Proposition G.1 (relative interior)"
      lean: "OQP27.bgp_relative_interior_point"
      module: "Solution"
      status: "proved"
      note: "The facet meets the relative interior of the no-signalling polytope."
    - source: "Problem 27.A; Proposition G.1 (no-signalling violation)"
      lean: "OQP27.bgp_no_signalling_violation"
      module: "Solution"
      status: "proved"
      note: "A rational no-signalling behaviour with F = 1/144."
    - source: "Problem 27.A; Proposition G.1 (not CGLMP_4)"
      lean: "OQP27.bgp_not_cglmp_four"
      module: "Solution"
      status: "proved"
      note: "No bijection of deterministic strategies matches the saturating sets."
    - source: "Problem 27.A; Proposition G.1 (no fusion lifting)"
      lean: "OQP27.bgp_no_fusion"
      module: "Solution"
      status: "proved"
      note: "F does not factor through any non-injective outcome maps on deterministic strategies."
