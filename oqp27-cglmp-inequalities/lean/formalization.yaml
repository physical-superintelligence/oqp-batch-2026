status:
  scope: >-
    Formalized: the CGLMP inequality (local bound 2, attained); Problem 27.B for projective
    measurements on maximally entangled states Phi_n of every dimension n (the value is at most the
    Fourier-phase value, with equality exactly when d divides n and the measurements are the
    Fourier-phase measurements tensored with an identity, up to a common unitary); failure of the
    highest global white-noise resistance for d = 2^m, m >= 955, and optimality for the CGLMP-witness
    threshold; failure of the best Kullback-Leibler discrimination for d = 2^m, m >= 41; the link
    between the tracial form and the state-and-tensor-product model; the comparison strategy's
    measurements are complete rank-one projective measurements; Problem 27.A via the
    Bancal-Gisin-Pironio facet (docs/FIDELITY.md).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

