version: "v0.4"

project:
  name: "The power of CGLMP inequalities (Open Quantum Problems, Problem 27)"
  description: >-
    Lean 4 formalization of statements for Open Quantum Problem 27 in the Bell scenario
    with two parties, two settings and d outcomes. For d >= 2 and projective measurements
    on maximally entangled states of local dimension n >= 1, the CGLMP value is at most
    the Fourier-phase value. Equality holds exactly for n = d k and Fourier-phase
    projectors tensored with the identity, up to one common unitary. Further statements
    compare tensor-CHSH and Fourier-phase behaviours at d = 2^m: smaller critical
    visibility under uniform behaviour noise for m >= 955, and larger uniform-input
    statistical strength than the Fourier-phase behaviour optimized over input laws for
    m >= 41. The development also gives the fixed CGLMP-witness threshold and properties
    of a four-outcome facet for Part A. The manuscript map in paper/README.md identifies
    the current paper's projective value and equality theorems and the earlier source
    labels used by the formalization.
  authors:
    - "David Turturean"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Turturean"

