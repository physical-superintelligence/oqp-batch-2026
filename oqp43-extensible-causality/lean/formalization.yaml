related_formalizations: []

status:
  scope: >-
    Proved: the eleven statements of Challenge.lean, about the definitions copied there from the
    library: an explicit four-qubit process that is extensibly causal, causally nonseparable and
    not purifiable, and the existential answer to the problem; the Pauli form of the process; the
    dimension dichotomy for two parties with port dimensions (m, d, n, e); purifiable processes are
    causally separable; the problem's transposed recovery formula defines the same purifiable
    processes; for positive operators, the conditions defining process matrices are equivalent to
    normalized probabilities for all pairs of local channels; causally ordered processes are
    purifiable; and three non-vacuity statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

