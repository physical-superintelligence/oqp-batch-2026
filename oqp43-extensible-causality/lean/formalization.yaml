alignment:
  namespace: "CausalNonpurifiability"
  statements:
    - source: "Open Quantum Problem 43, the question"
      lean: "CausalNonpurifiability.OQP43.not_all_extensiblyCausal_purifiable"
      module: "Solution"
      status: "proved"
      note: "Two parties with qubit input and output systems; library theorem oqp43_negative."
    - source: "Theorem 1.1"
      lean: "CausalNonpurifiability.OQP43.theorem_1_1"
      module: "Solution"
      status: "proved"
      note: "Full rank is stated as positive definiteness; library theorem theorem_intro."
    - source: "Equation for W_q (Pauli form)"
      lean: "CausalNonpurifiability.OQP43.wq_pauli_form"
      module: "Solution"
      status: "proved"
      note: "Library theorem eq_qubit_pauli; checked entrywise by kernel evaluation over the rationals."
    - source: "Appendix B, last statement; the problem's recovery formula with S^T"
      lean: "CausalNonpurifiability.OQP43.purifiable_iff_transpose_formula"
      module: "Solution"
      status: "proved"
      note: "The formula with the full transpose S^T; library theorem purifiable_iff_transpose_convention."
    - source: "Lemma 2.3, first statement"
      lean: "CausalNonpurifiability.OQP43.valid_iff_channels_normalized"
      module: "Solution"
      status: "proved"
      note: "For positive W; library theorem valid_iff_channel_normalization."
    - source: "Non-vacuity of purifiability"
      lean: "CausalNonpurifiability.OQP43.white_process_purifiable"
      module: "Solution"
      status: "proved"
      note: "The white-noise process I/(mn); library theorem white_process."
    - source: "Non-vacuity of causality"
      lean: "CausalNonpurifiability.OQP43.swap_table_not_causal"
      module: "Solution"
      status: "proved"
      note: "Library theorem not_causal_swap."
    - source: "Appendix C (the process of Oreshkov, Costa and Brukner)"
      lean: "CausalNonpurifiability.OQP43.ocb_process_not_extensiblyCausal"
      module: "Solution"
      status: "proved"
      note: "Two clauses of the library theorem appC_OCB_game."
    - source: "The dimension dichotomy (Theorem 3.1 and its consequence)"
      lean: "CausalNonpurifiability.OQP43.dimension_dichotomy"
      module: "Solution"
      status: "proved"
      note: "Two parties, all port dimensions (m, d, n, e); library theorem dimension_dichotomy."
    - source: "Theorem 6.1 (Yokojima, Quintino, Soeda and Murao, Corollary 1; Barrett, Lorenz and Oreshkov, Theorem 3)"
      lean: "CausalNonpurifiability.OQP43.purifiable_causallySeparable"
      module: "Solution"
      status: "proved"
      note: "Library theorem purifiable_causallySeparable."
    - source: "Proposition 9.2 (Araújo, Feix, Navascués and Brukner, Section 3)"
      lean: "CausalNonpurifiability.OQP43.ordered_processes_purifiable"
      module: "Solution"
      status: "proved"
      note: "Causally ordered processes are purifiable, in all dimensions; library theorem ordered_purifiable."
