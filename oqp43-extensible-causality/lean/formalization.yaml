  spend_usd: "not tracked"
  notes: >-
    Provenance and use of AI. This result was released by Physical Superintelligence (PSI). The
    mathematics was developed by PSI researchers working with AI models (OpenAI's GPT-6-Astra and Anthropic's Claude Fable 5.1, Claude Opus 5 and Claude Opus 5.5) in automated research workflows at PSI. The Lean formalization was
    written by AI agents (Anthropic's Claude Fable 5.1 and Claude Opus 5.5 in Claude Code, and OpenAI's GPT-6-Astra in Codex)
