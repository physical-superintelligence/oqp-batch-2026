# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Extensibly causal processes that are not purifiable (Open Quantum Problem 43)"
  description: >-
    A negative answer to IQOQI Vienna Open Quantum Problem 43, "Are all extensibly causal
    processes purifiable?": an explicit process matrix for two parties with qubit inputs and
    outputs is extensibly causal and causally nonseparable, and it is not purifiable, with purity
    in the sense of Araújo, Feix, Navascués and Brukner and purifications of every finite
    dimension excluded. Also formalized: for two parties with port dimensions (m, d, n, e), every
    extensibly causal process is purifiable exactly when one of the four dimensions is 1;
    purifiable processes are causally separable; the problem's transposed recovery formula
    defines the same purifiable processes; causally ordered processes are purifiable; and three
    non-vacuity statements for the definitions.
  authors:
    - "David Turturean"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Turturean"

