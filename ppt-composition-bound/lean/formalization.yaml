version: "v0.4"

project:
  name: "PPT composition bound: 2(d-1) PPT maps compose to an entanglement-breaking map"
  description: >-
    Lean 4 formalization of Theorem 1 of "Entanglement Breaking after 2(d-1) PPT Maps": for
    d >= 2, the composition of any 2(d-1) PPT maps on d x d complex matrices is entanglement
    breaking. PPT means completely positive and completely copositive. The maps may differ,
    and trace preservation is optional. The entanglement-breaking index of each PPT map is at
    most 2(d-1). The development also proves the bound for compositions of any N >= 2(d-1)
    PPT maps and for 2(d-1) copies of a PPT map interleaved with completely positive maps,
    together with the Choi criteria and the stated conventions for composition and index.
  authors:
    - "David Turturean"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Turturean"

