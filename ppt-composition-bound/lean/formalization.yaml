    - method: "agent"
      models: ["OpenAI's GPT-6-Astra"]
      framework: "Codex"
      tool_setup: "Codex agents continued the formalization from 2026-10-09 and completed the verification of the full manuscript in PSI's development repository; this release holds the import cone of Theorem 1."
      cost:
        wall_time: "2026-10-09 to 2026-10-11"
        spend_usd: "subscription-based"
        hardware: "API-only agents; remote Linux build machines"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Provenance and use of AI. This result was released by Physical Superintelligence (PSI). The
    mathematics was developed by PSI researchers working with AI models (OpenAI's GPT-5.6-Sol,
    GPT-5.6 Pro and GPT-6-Astra and Anthropic's Claude Opus 5) in automated research workflows
    at PSI. The Lean formalization was written by AI agents (Anthropic's Claude Opus 5.5 in Claude Code, and OpenAI's GPT-6-Astra
    in Codex) under PSI's direction. David Turturean and Ning Bao are responsible for the
    correctness of the paper. The paper's AI disclosure has the details; this file records which
    agent did which part. Comparator checks that the theorems proved in Solution.lean are
    exactly the statements in Challenge.lean, using only the three standard axioms, and the
    proofs are replayed by Lean's kernel and by independent kernels.

review:
  status: "statements checked"
  reviewers:
    - "Physical Superintelligence (PSI)"

alignment:
  namespace: "PPTCompositionBound"
  statements:
    - source: "Theorem 1, first sentence"
      lean: "PPTCompositionBound.compose_ppt_maps_entanglementBreaking"
      module: "Solution"
      status: "proved"
      note: "Headline. Stated in Challenge.lean; d >= 2, arbitrary PPT maps on M_d, possibly different, trace preserving or not."
    - source: "Theorem 1, second sentence"
      lean: "PPTCompositionBound.ebIndex_le_of_isPPTMap"
      module: "Solution"
      status: "proved"
      note: "Index = least m >= 1 with T^m entanglement breaking (top if none)."
    - source: "Extension of Theorem 1"
      lean: "PPTCompositionBound.compose_at_least_ppt_maps_entanglementBreaking"
      module: "Solution"
      status: "proved"
      note: "Any N >= 2(d-1) PPT maps."
    - source: "Interleaved index"
      lean: "PPTCompositionBound.compose_ppt_map_interleaved_entanglementBreaking"
      module: "Solution"
      status: "proved"
      note: "2(d-1) copies of one PPT map with arbitrary completely positive maps in between."
    - source: "Properties of the definitions"
      lean: "PPTCompositionBound.exists_posSemidef_not_isSeparable"
      module: "Solution"
      status: "proved"
      note: "Some positive operator on C^2 (x) C^d, d >= 2, is not separable."
    - source: "Properties of the definitions"
      lean: "PPTCompositionBound.id_not_entanglementBreaking"
      module: "Solution"
      status: "proved"
      note: "The identity map on M_d, d >= 2, is not entanglement breaking."
    - source: "Choi's theorem"
      lean: "PPTCompositionBound.choi_isCompletelyPositive_iff"
      module: "Solution"
      status: "proved"
      note: "Complete positivity iff the Choi matrix is positive."
    - source: "Choi criterion for PPT maps"
      lean: "PPTCompositionBound.choi_isPPTMap_iff"
      module: "Solution"
      status: "proved"
      note: "PPT iff the Choi matrix is positive with positive partial transpose."
    - source: "Choi criterion for entanglement breaking"
      lean: "PPTCompositionBound.choi_isEntanglementBreaking_iff"
      module: "Solution"
      status: "proved"
      note: "Entanglement breaking iff the Choi matrix is separable."
    - source: "Definition of PPT maps"
      lean: "PPTCompositionBound.transposeMap_isCompletelyCopositive_not_isCompletelyPositive"
      module: "Solution"
      status: "proved"
      note: "Transposition on M_2 is completely copositive but not completely positive, so a PPT map must be required to be both."
    - source: "Order convention of compositions"
      lean: "PPTCompositionBound.compList_pair"
      module: "Solution"
      status: "proved"
      note: "compList [a, b] = b after a: the head of the list acts first."
    - source: "Index convention"
      lean: "PPTCompositionBound.zero_map_isPPTMap_and_ebIndex_eq_one"
      module: "Solution"
      status: "proved"
      note: "The zero map is PPT with index 1; powers start at m = 1."
    - source: "Index convention"
      lean: "PPTCompositionBound.ebIndex_id_eq_top"
      module: "Solution"
      status: "proved"
      note: "For d >= 2 the identity map on M_d has index top: no power of it is entanglement breaking."
