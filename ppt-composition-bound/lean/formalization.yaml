status:
  scope: >-
    Formalized: Theorem 1 of the paper (both sentences) for every d >= 2 and arbitrary, possibly
    different PPT maps on d x d complex matrices, trace preserving or not; compositions of any
    N >= 2(d-1) PPT maps; 2(d-1) copies of one PPT map interleaved with completely positive maps;
    properties of the definitions (Choi criteria for complete positivity, PPT and entanglement
    breaking; an entangled positive operator on C^2 (x) C^d; the identity map is not entanglement
    breaking; transposition on M_2 is completely copositive but not completely positive; the order
    convention of the ordered composition; the index of the zero map is 1 and that of the identity
    is top). Operators are unnormalized, and maps are arbitrary linear maps.
  # Excludes the thirteen deliberate statement placeholders in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

